services:
  # ── ETL + Model training (one-time init job) ──────────────────────────────
  init:
    build: .
    image: uc02-group-assistant:latest
    command: >
      bash -c "
        python -m etl.build_snapshots &&
        python -m etl.features &&
        python -m models.train_conversion &&
        echo 'Init complete'
      "
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    env_file: .env
    restart: "on-failure"

  # ── FastAPI backend (also serves React frontend at /) ─────────────────────
  api:
    image: uc02-group-assistant:latest
    command: >
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8888
    expose:
      - "8888"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    env_file: .env
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Nginx reverse proxy (stays up during deploys — zero downtime) ──────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8888:8888"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - api
