version: "3.9"

services:
  # ── ETL + Model training (one-time init job) ──────────────────────────────
  init:
    build: .
    image: uc02-group-assistant:latest
    command: >
      bash -c "
        python -m etl.build_snapshots &&
        python -m etl.features &&
        python -m models.train_conversion
      "
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    env_file: .env
    restart: "on-failure"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    image: uc02-group-assistant:latest
    command: >
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    env_file: .env
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  ui:
    image: uc02-group-assistant:latest
    command: >
      streamlit run ui/app.py
        --server.port 8080
        --server.address 0.0.0.0
        --server.headless true
        --browser.gatherUsageStats false
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8888
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
