version: "3.9"

services:
  # ── ETL + Model training (one-time init job) ──────────────────────────────
  init:
    build: .
    image: uc02-group-assistant:latest
    command: >
      bash -c "
        python -m etl.build_snapshots &&
        python -m models.train_conversion
      "
    volumes:
      - data_vol:/app/data
      - model_vol:/app/models/artifacts
    env_file: .env
    restart: "no"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    image: uc02-group-assistant:latest
    command: >
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - data_vol:/app/data
      - model_vol:/app/models/artifacts
    env_file: .env
    restart: always
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  ui:
    image: uc02-group-assistant:latest
    command: >
      streamlit run ui/app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
        --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    volumes:
      - data_vol:/app/data
      - model_vol:/app/models/artifacts
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
    restart: always
    depends_on:
      api:
        condition: service_healthy

volumes:
  data_vol:
  model_vol:
